   ${DESFX.map(g=>{const selected=groupEffect(cur,g);return html`<div key=${g[0]}><div className="lab" style=${{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}><span>${g[0]}</span>${selected&&html`<button className="tile rounded-sm px-2 py-1 text-xs" aria-label=${g[0]+' 효과 해제'} onClick=${()=>ed(designPatch(cur,g,null))}>해제</button>`}</div><${HRow} cls="browse" sel=${selected?.k}>${g[1].map(f=>html`<${T} key=${f[0]} l=${f[1]} on=${selected?.k===f[0]} fn=${()=>ed(designPatch(cur,g,f[0]))} child=${html`<${Mini} id=${'d'+f[0]} shape=${st.shape} n=${{...cm,des:'none',dl:[{k:f[0],c:effectColor(g,f[0],selected?.c||cm.dc)}],mo:[],it:[]}}/>`}/>`)}<//>${selected&&html`<div className="mt-3 p-3 border rounded-sm" style=${{borderColor:'var(--line)'}}><div className="text-xs mb-3">${g[0]} 컬러</div><${ColorPick} value=${selected.c} onChange=${c=>ed(designPatch(cur,g,selected.k,c),'dc:'+g[0])} onCommit=${addRec}/>${applyFrom('디자인 전체 적용',['des','dc','dl','mo'])}</div>`}</div>`})}


   <div className="sec">모티프</div><${HRow} cls="browse"><${T} l="없음" on=${cur.mo.length===0} fn=${()=>{ed({mo:[]});setAm(0)}} child=${html`<${Mini} id="mnone" shape=${st.shape} n=${{...cm,des:'none',dl:[],mo:[],it:[]}}/>`}/>
    ${MOTIF.map(f=>html`<${T} key=${f[0]} l=${f[1]} on=${false} fn=${()=>add('mo',f[0])} child=${html`<${Mini} id=${'m'+f[0]} shape=${st.shape} n=${{...cm,des:'none',dl:[],mo:[{k:f[0],sd:3,x:0,y:.5,s:2,r:0,c:DEF[f[0]]}],it:[]}}/>`}/>`)}<//>

   ${applyFrom('이 디자인을 전체 손톱에 적용',['des','dc','dl','mo'])}</div>`}
  ${tab==='parts'&&html`<div className="parts-panel"><div className="pt-2"><button className="tile rounded-sm px-3 py-1 text-xs" aria-pressed=${cur.it.length===0} onClick=${()=>{ed({it:[]});setAi(0)}}>파츠 없음</button></div>${cur.it.length>0&&listUI('it',ai,setAi,'추가한 파츠')}<div className="sec flex items-center justify-between gap-3"><span>파츠 선택</span><details className="category-menu" onKeyDown=${e=>{if(e.key==='Escape'){e.currentTarget.open=false;e.currentTarget.querySelector('summary').focus()}}}><summary aria-label="파츠 카테고리" className="category-trigger"><span>${partCategory}</span><svg className="category-arrow" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.2" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary><div className="category-options">${PART_CATEGORIES.map(c=>html`<button key=${c[0]} type="button" aria-pressed=${partCategory===c[0]} onClick=${e=>{setPartCategory(c[0]);e.currentTarget.closest('details').open=false}}>${c[0]}</button>`)}</div></details></div>
   ${(partCategory==='전체'?PART_GROUPS:[[partCategory,PARTS.filter(f=>partVisible(f[0]))]]).map(group=>html`<div key=${group[0]}><div className="lab">${group[0]}</div><${HRow} cls="browse">${group[1].filter(f=>partVisible(f[0])).map(f=>html`<${T} key=${f[0]} l=${f[1]} on=${false} fn=${()=>add('it',f[0])} child=${html`<${Mini} id=${'i'+f[0]} long=${true} shape=${st.shape} n=${{...cm,des:'none',dl:[],mo:[],it:[{k:f[0],sd:3,x:0,y:.5,s:/^(bear|bunny|cat)/.test(f[0])?2.5:2,r:0,c:DEF[f[0]]||'#ffffff'}]}}/>`}/>` )}<//></div>` )}

   ${applyFrom('이 파츠를 전체 손톱에 적용',['it'])}</div>`}
 <section className="editor-about"><h1>나만의 네일아트를 무료로 만들어 보세요.</h1><p>시럽네일, 프렌치네일, 그라데이션과 리본·진주 파츠를 조합해 셀프네일 아이디어와 네일숍에 보여줄 도안을 만들어 보세요.</p><p><a href="./examples.html">디자인 갤러리</a> · <button type="button" onClick=${startTutorial}>사용법</button> · <a href="./privacy.html">개인정보·통계·문의</a></p><small>컬러와 파츠를 자유롭게 조합하고, 완성 이미지를 저장할 수 있어요.</small></section></aside>
 ${tour&&html`<section ref=${tutorialPanel} className="tutorial-panel" role="dialog" aria-modal="false" aria-labelledby="tutorial-title" aria-describedby="tutorial-description" tabIndex="-1"><div className="tutorial-heading"><span className="tutorial-progress">${tutorialStep+1} / ${tutorial.length}</span><button type="button" className="tile" aria-label="튜토리얼 닫기" onClick=${closeTutorial}>×</button></div><h2 id="tutorial-title">${tour[0]}</h2><p id="tutorial-description">${tour[1]}</p><div className="tutorial-actions"><button type="button" className="tile" disabled=${tutorialStep===0} onClick=${()=>moveTutorial(tutorialStep-1)}>이전</button><button type="button" className="tile" onClick=${()=>moveTutorial(tutorialStep+1)}>${tutorialStep===tutorial.length-1?'끝내기':'다음'}</button></div></section>`}

 <input ref=${fileInput} type="file" accept=".json,application/json" aria-label="작업 파일 선택" style=${{display:'none'}} onChange=${importWork}/>

 ${saved&&html`<div className="fixed inset-0 z-50 flex items-center justify-center p-5" style=${{background:'rgba(20,16,18,.55)'}} onClick=${()=>setSaved(null)}><div className="max-w-[560px] w-full p-4 text-center" style=${{background:'var(--bg)'}} onClick=${e=>e.stopPropagation()}><img src=${saved} alt="완성된 네일 디자인" className="w-full"/><p className="text-xs my-3" style=${{color:'var(--mut)'}}>이미지를 길게 누르거나 우클릭해서 저장하세요.</p><button className="tile export-download w-full py-3 mb-2" onClick=${shareToGallery}>갤러리에 올리기</button><div className="flex gap-2"><button className="tile flex-1 py-3" onClick=${()=>setSaved(null)}>닫기</button><a href=${saved} download="나만의-네일.png" className="tile export-download flex-1 py-3">파일로 받기</a></div></div></div>`}
 </div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
